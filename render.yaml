services:
  - type: web
    name: pleno
    runtime: node
    plan: free
    buildCommand: "echo 'No build step required'"
    startCommand: "node server.mjs"
    healthCheckPath: /
    envVars:
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
  - type: cron
    name: pleno-daily-challenge
    runtime: node
    plan: starter
    buildCommand: "echo 'No build step required'"
    startCommand: "node scripts/publish-daily-challenge.mjs"
    schedule: "0 0 * * *"
    envVars:
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
